apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catsdogs-api
  template:
    metadata:
      labels:
        app: catsdogs-api
    spec:
      containers:
      - name: catsdogs-api
        image: catsdogs-api:latest
        ports:
        - containerPort: 8000